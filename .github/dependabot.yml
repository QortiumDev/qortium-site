version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 5
    # @astrojs/check 0.9.10 supports TypeScript 5/6; revisit when it supports 7.
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]
    commit-message:
      prefix: deps
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/New_York
    open-pull-requests-limit: 2
    commit-message:
      prefix: deps
    groups:
      github-actions:
        patterns:
          - "*"
